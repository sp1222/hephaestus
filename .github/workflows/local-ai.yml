name: Build and Push local-ai wrapper

on:
  push:
    branches:
      - main
    paths:
      - 'local-ai/Dockerfile'
  pull_request:
    branches:
      - main
    paths:
      - 'local-ai/Dockerfile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/local-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Local-AI SHA from Dockerfile
        id: local_ai_sha
        run: |
          SHA=$(grep -oP '(?<=^FROM localai/localai@sha256:)[0-9a-f]+' local-ai/Dockerfile)
          if [ -z "$SHA" ]; then
            echo "::error::Could not find a 'FROM localai/localai@sha256:...' line in local-ai/Dockerfile"
            exit 1
          fi

          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Detected Local-AI SHA: $SHA"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=local-ai-${{ steps.local_ai_sha.outputs.sha }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./local-ai
          file: ./local-ai/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
