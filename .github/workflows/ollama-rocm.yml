name: Build and Push ollama-rocm

on:
  push:
    branches:
      - main
    paths:
      - 'ollama-rocm/gfx-1010/Dockerfile'
  pull_request:
    branches:
      - main
    paths:
      - 'ollama-rocm/gfx-1010/Dockerfile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ollama-rocm-gfx-1010

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Ollama version from Dockerfile
        id: ollama_version
        run: |
          VERSION=$(grep '^FROM ollama/ollama:' ollama-rocm/gfx-1010/Dockerfile \
            | sed 's/FROM ollama\/ollama:\(.*\)-rocm/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Ollama version: $VERSION"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=ollama-${{ steps.ollama_version.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./ollama-rocm/gfx-1010
          file: ./ollama-rocm/gfx-1010/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
